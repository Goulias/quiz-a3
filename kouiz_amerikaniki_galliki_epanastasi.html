</style></head><body><div class="wrap"><header class="hero"><h1>Κεφάλαιο Α3 – Αμερικανική και Γαλλική Επανάσταση</h1><div>Ιστορία ΣΤ΄ Δημοτικού · 20 ερωτήσεις</div></header><div class="track"><div class="bar" id="bar"></div></div><div class="muted" id="status">Ερώτηση 1 από 20</div><main class="card" id="quiz"><div class="muted" id="kind"></div><div class="q" id="question"></div><div id="options"></div><details class="hint"><summary>Χρειάζομαι μια βοήθεια</summary><p id="hint"></p></details><div id="feedback"></div><div><button class="secondary" id="prev">Προηγούμενη</button><button class="primary" id="check">Έλεγχος απάντησης</button><button class="primary hidden" id="next">Επόμενη</button></div><p class="muted">Στις ερωτήσεις πολλαπλών επιλογών επίλεξε όλες τις σωστές απαντήσεις.</p></main><section class="card hidden" id="result"></section></div>
<script>
const qs=[["s", "Ποιο πνευματικό κίνημα επηρέασε την Αμερικανική και τη Γαλλική Επανάσταση;", ["Η Αναγέννηση", "Ο Διαφωτισμός", "Η Θρησκευτική Μεταρρύθμιση", "Ο Ρομαντισμός"], [1], "Το κίνημα αυτό αναπτύχθηκε κυρίως τον 18ο αιώνα.", ["Η Αναγέννηση ανήκει σε προηγούμενη περίοδο.", "Οι ιδέες του Διαφωτισμού επηρέασαν τις επαναστάσεις.", "Η Θρησκευτική Μεταρρύθμιση συνδέεται με τον 16ο αιώνα.", "Ο Ρομαντισμός αναπτύχθηκε αργότερα."]], ["s", "Ποια χρονιά ξέσπασε η Αμερικανική Επανάσταση;", ["1776", "1789", "1791", "1815"], [0], "Συνέβη πριν από τη Γαλλική Επανάσταση.", ["Το 1776 ξέσπασε η Αμερικανική Επανάσταση.", "Το 1789 ξέσπασε η Γαλλική Επανάσταση.", "Το 1791 ψηφίστηκε το γαλλικό Σύνταγμα.", "Το 1815 έγινε η ήττα στο Βατερλώ."]], ["s", "Τι διεκδίκησαν οι άποικοι του Νέου Κόσμου;", ["Την ανεξαρτησία τους από τους Βρετανούς", "Την επέκταση της βρετανικής κυριαρχίας", "Την επιστροφή στην αποικιακή διοίκηση", "Την ένωση με τη Γαλλία"], [0], "Σκέψου ποιο ήταν το βασικό αίτημά τους.", ["Αυτό ήταν το βασικό αίτημα των αποίκων.", "Οι άποικοι εξεγέρθηκαν εναντίον της βρετανικής κυριαρχίας.", "Ήθελαν να απαλλαγούν από την αποικιακή διοίκηση.", "Το αίτημά τους δεν ήταν η ένωση με τη Γαλλία."]], ["s", "Ποιο νέο κράτος σχηματίστηκε μετά την Αμερικανική Επανάσταση;", ["Η Γαλλική Δημοκρατία", "Το Ηνωμένο Βασίλειο", "Οι Ηνωμένες Πολιτείες της Αμερικής", "Η Ιταλική Δημοκρατία"], [2], "Το όνομα περιλαμβάνει τη λέξη «Πολιτείες».", ["Η Γαλλική Δημοκρατία συνδέεται με τη Γαλλική Επανάσταση.", "Το Ηνωμένο Βασίλειο δεν προέκυψε από αυτή την επανάσταση.", "Οι άποικοι σχημάτισαν τις Ηνωμένες Πολιτείες.", "Η Ιταλική Δημοκρατία δεν ήταν αποτέλεσμά της."]], ["s", "Ποιος συνέταξε τη Διακήρυξη της Αμερικανικής Ανεξαρτησίας;", ["Ο Λουδοβίκος ΙΣΤ΄", "Ο Τόμας Τζέφερσον", "Ο Ναπολέων", "Ο Ροβεσπιέρος"], [1], "Ήταν Αμερικανός πολιτικός.", ["Ο Λουδοβίκος ΙΣΤ΄ ήταν βασιλιάς της Γαλλίας.", "Ο Τζέφερσον συνέταξε τη Διακήρυξη.", "Ο Ναπολέων ανήκει σε μεταγενέστερη περίοδο.", "Ο Ροβεσπιέρος ήταν ηγετική μο  1789.", "Ο Ναπολέων έγινε αυτοκράτορας αργότερα."]], ["s", "Ποιες ιδέες εξέφραζε η Διακήρυξη των Δικαιωμάτων του Ανθρώπου και του Πολίτη;", ["Η υπακοή, η υποταγή και η μοναρχία", "Η ελευθερία, η ισότητα και η αδελφοσύνη", "Η κατάκτηση, η δύναμη και η επέκταση", "Η διάκριση, τα προνόμια και η απολυταρχία"], [1], "Είναι το γνωστό σύνθημα της Γαλλικής Επανάστασης.", ["Η Διακήρυξη εξέφραζε φιλελεύθερες ιδέες.", "Αυτές ήταν οι βασικές αρχές της Διακήρυξης.", "Δεν ήταν αυτές οι αρχές της Διακήρυξης.", "Η Διακήρυξη αντιτασσόταν στα προνόμια και την απολυταρχία."]], ["t", "Σύμφωνα με τη Διακήρυξη, η εξουσία πηγάζει από το έθνος και όχι από τον μονάρχη;", ["Σωστό", "Λάθος"], [0], "Θυμήσου ποια θεωρείται πηγή της εξουσίας.", ["Η Διακήρυξη όριζε ως πηγή της εξουσίας το έθνος.", "Η πρόταση είναι λανθασμένη: πηγή της εξουσίας είναι το έθνος."]], ["s", "Τι προέβλεπε το φιλελεύθερο Σύνταγμα της Γαλλίας του 1791;", ["Περιόριζε τις εξουσίες του βασιλιά προς όφελος του Κοινοβουλίου", "Ενίσχυε την απόλυτη εξουσία του βασιλιά", "Καταργούσε αμέσως κάθε μορφή βασιλείας", "Έδινε δικαίωμα ψήφου σε όλους τους κατοίκους"], [0], "Σύγκρινε την εξουσία του βασιλιά με εκείνη του Κοινοβουλίου.", ["Το Σύνταγμα περιόρισε τις εξουσίες του βασιλιά προς όφελος του Κοινοβουλίου.", "Δεν ενίσχυσε την απόλυτη εξουσία του βασιλιά.", "Δεν καταργήθηκε τότε η βασιλεία.", "Δεν δόθηκε ψήφος σε όλους τους κατοίκους."]], ["m", "Ποιοι αποκλείστηκαν από το δικαίωμα ψήφου σύμφωνα με το Σύνταγμα του 1791; Επίλεξε όλες τις σωστές απαντήσεις.", ["Όσοι δεν πλήρωναν φόρους", "Οι γυναίκες", "Οι άνδρες που πλήρωναν φόρους", "Οι ενεργοί πολίτες"], [0, 1], "Το βιβλίο αναφέρει περιορισμούς για τους ενεργούς πολίτες και τις γυναίκες.", ["Όσοι δεν πλήρωναν φόρους δεν είχαν δικαίωμα ψήφου.", "Οι γυναίκες αποκλείστηκαν από την ψήφο.", "Οι φορολογούμενοι άνδρες ανήκαν στους ενεργούς πολίτες.", "Οι ενεργοί πολίτες είχαν δικαίωμα ψήφου."]], ["s", "Ποια εξέλιξη χαρακτηρίζει το δεύτερο στάδιο της Γαλλικής Επανάστασης;", ["Η εξουσία π ["Δεν αναφέρεται εκστρατεία του στην Αμερική.", "Δεν έφτασε μέχρι την Ινδία.", "Δεν έφτασε μέχρι την Αυστραλία.", "Οι εκστρατείες του έφτασαν μέχρι τη Ρωσία."]], ["s", "Ποιο γεγονός έβαλε τέλος στους Ναπολεόντειους πολέμους το 1815;", ["Η άλωση της Βαστίλης", "Η Διακήρυξη της Αμερικανικής Ανεξαρτησίας", "Η ψήφιση του γαλλικού Συντάγματος", "Η ήττα του Ναπολέοντα στο Βατερλώ"], [3], "Θυμήσου τη μάχη του 1815.", ["Η Βαστίλη καταλήφθηκε το 1789.", "Η Διακήρυξη της Αμερικανικής Ανεξαρτησίας έγινε το 1776.", "Το Σύνταγμα ψηφίστηκε το 1791.", "Οι πόλεμοι τελείωσαν το 1815 με την ήττα στο Βατερλώ."]]];let n=0,ans=Array(qs.length).fill(null),done=Array(qs.length).fill(false);
const $=x=>document.getElementById(x);
function draw(){let q=qs[n];$('status').textContent=`Ερώτηση ${n+1} από ${qs.length} · Απαντημένες ${ans.filter(x=>x!==null).length}/${qs.length}`;$('bar').style.width=(n/qs.length*100)+'%';$('kind').textContent=q[0]==='m'?'ΠΟΛΛΑΠΛΗΣ ΕΠΙΛΟΓΗΣ':q[0]==='t'?'ΣΩΣΤΟ Ή ΛΑΘΟΣ':'ΠΟΛΛΑΠΛΗΣ ΕΠΙΛΟΓΗΣ – ΜΙΑ ΣΩΣΤΗ';$('question').textContent=q[1];$('hint').textContent=q[4];$('options').innerHTML='';q[2].forEach((v,i)=>{let l=document.createElement('label');l.className='opt';let inp=document.createElement('input');inp.type=q[0]==='m'?'checkbox':'radio';inp.name='ans';inp.checked=!!ans[n]?.includes(i);inp.disabled=done[n];inp.onchange=()=>{if(q[0]==='m'){let a=ans[n]||[];ans[n]=inp.checked?[...a,i]:a.filter(x=>x!==i)}else ans[n]=[i];$('check').disabled=false;};let s=document.createElement('span');s.textContent=v;l.append(inp,s);$('options').append(l)});$('feedback').className='';$('feedback').textContent='';$('check').classList.toggle('hidden',done[n]);$('next').classList.toggle('hidden',!done[n]);$('check').disabled=ans[n]===null;$('prev').disabled=n===0;if(done[n])feedback()}
function feedback(){let q=qs[n],a=ans[n]||[],ok=a.length===q[3].length&&a.every(x=>q[3].includes(x));$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').textContent=(ok?'Μπράβο! Σωστή απάντηση. ':'Δεν είναι ακριβώς σωστό. ')+a.map(i=>q[2][i]+': '+q[5]?.[i]||q[2][i]).join(' ')+(q[0]==='m'?' Έλεγξε όλες τις επιλογές.':'')}
$('check').onclick=()=>{if(ans[n]===null)return;done[n]=true;draw()};$('prev').onclick=()=>{if(n>0){n--;draw()}};$('next').onclick=()=>{if(n<qs.length-1){n++;draw()}else finish()};
function finish(){let score=qs.reduce((s,q,i)=>s+(ans[i].length===q[3].length&&ans[i].every(x=>q[3].includes(x))?1:0),0);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('bar').style.width='100%';$('status').textContent='Το κουίζ ολοκληρώθηκε';let r=$('result');r.innerHTML=`<h2>Ολοκλήρωσες το κουίζ!</h2><div class="score">${score} / ${qs.length}</div><p>${score===20?'Εξαιρετικά!':score>=15?'Πολύ καλή προσπάθεια!':'Συνέχισε την εξάσκηση!'}</p><button class="primary" id="rev">Δες τις σωστές απαντήσεις</button><button class="secondary" onclick="location.reload()">Ξανά από την αρχή</button><div id="review" class="hidden"></div>`;$('rev').onclick=()=>{let box=$('review');box.classList.toggle('hidden');if(box.dataset.ready)return;qs.forEach((q,i)=>{let d=document.createElement('div');d.className='reviewitem';let ok=ans[i].length===q[3].length&&ans[i].every(x=>q[3].includes(x));d.textContent=`${i+1}. ${ok?'✓':'✗'} ${q[1]} Σωστό: ${q[3].map(x=>q[2][x]).join(' · ')}`;box.append(d)});box.dataset.ready='1'}}
